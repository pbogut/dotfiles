[main]
term=xterm-256color
font=JetBrainsMono Nerd Font Mono:style=Regular:size=12
font-bold=JetBrainsMono Nerd Font Mono:style=Bold:size=12
font-italic=JetBrainsMono Nerd Font Mono:style=Italic:size=12
font-bold-italic=JetBrainsMono Nerd Font Mono:style=Bold Italic:size=12
dpi-aware=no
box-drawings-uses-font-glyphs=no
pad=0x0
initial-window-mode=windowed
resize-by-cells=no
resize-keep-grid=no
resize-delay-ms=0

[environment]
TERMINAL=foot

[csd]
preferred=none
size=0

[scrollback]
lines=10000
multiplier=3
indicator-position=none

[security]
osc52=copy-enabled

[bell]
system=no
urgent=yes

[key-bindings]
show-urls-launch=Mod1+u
clipboard-paste=Control+Shift+v XF86Paste Mod1+Control+p
primary-paste=Shift+Insert Mod1+Control+v
# Foot has no Vi mode; retain the backward-search shortcut without it.
search-start=Control+Shift+b Mod1+Control+s
scrollback-home=Shift+Home
scrollback-end=Shift+End

[search-bindings]
extend-to-word-boundary=Control+Shift+Right
delete-prev-word=Mod1+BackSpace Control+BackSpace Control+w
clipboard-paste=Control+v Control+y Control+Shift+v XF86Paste Mod1+Control+p
primary-paste=Shift+Insert Mod1+Control+v

[mouse-bindings]
select-begin-block=Mod1+BTN_LEFT
select-quote=none
select-row=BTN_LEFT-3

[text-bindings]
\x1b[13;2u=Shift+Return

[cursor]
style=block
unfocused-style=hollow
blink=no
blink-rate=750

# Matches themes/tokyo-night/alacritty.toml.
# Cursor colors default to inverted cell colors, as in Alacritty.
[colors-dark]
background=1a1b26
foreground=a9b1d6

regular0=32344a
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=ad8ee6
regular6=449dab
regular7=787c99

bright0=444b6a
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7da6ff
bright5=bb9af7
bright6=0db9d7
bright7=acb0d0

selection-foreground=1a1b26
selection-background=7aa2f7

jump-labels=181818 f4bf75
search-box-match=181818 d8d8d8
search-box-no-match=181818 d8d8d8

[url]
launch=xdg-open ${url}
label-letters=jfkdls;ahgurieowpq
style=single
# POSIX ERE equivalent of Alacritty's hint regex, with the whole URL captured.
regex=((ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)//[a-zA-Z0-9,'+._/?=&%:-]+)
