id = "pbogut.workspace-sort"
name = "Workspace Sort"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Sort sidebar workspaces by name"
platforms = ["linux"]

[[startup]]
command = ["python3", "sort-workspaces.py"]

[[events]]
on = "workspace.created"
command = ["python3", "sort-workspaces.py"]
